services:
  caddy:
    image: caddy:2.11.2
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - n8n

  n8n:
    image: n8nio/n8n:2.13.2
    restart: always
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      # configuraciones de n8n 
      - N8N_HOST=n8n-carlos-proyecto.eastus2.cloudapp.azure.com
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://n8n-carlos-proyecto.eastus2.cloudapp.azure.com/
      - N8N_ENCRYPTION_KEY=K2025FERMENTACIONCAFE
      - GENERIC_TIMEZONE=America/Bogota
      - TZ=America/Bogota
      - N8N_COMMUNITY_PACKAGES_ENABLED=true
      - N8N_MIGRATE_FS_STORAGE_PATH=true
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=all
      # configuraciones de postgresdb
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=n8n2025seguro
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - postgres

  postgres:
    image: postgres:15
    restart: always
    environment:
      - POSTGRES_USER=n8n
      - POSTGRES_PASSWORD=n8n2025seguro
      - POSTGRES_DB=n8n
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  n8n_data:
  caddy_data:
  caddy_config:
  postgres_data:
