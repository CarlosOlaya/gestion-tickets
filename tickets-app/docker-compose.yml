services:
  postgres-tickets:
    image: postgres:15
    container_name: postgres-tickets
    restart: always
    environment:
      - POSTGRES_USER=tickets_user
      - POSTGRES_PASSWORD=tickets2025seguro
      - POSTGRES_DB=tickets
    volumes:
      - postgres_tickets_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5433:5432"
    networks:
      - n8n-network

volumes:
  postgres_tickets_data:

networks:
  n8n-network:
    external: true
    name: n8n-docker_default
